<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LED 제어판</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    이 파일은 디자인 시안(preview.png)을 AI 에이전트에게 보여 주고 코드로 만들게 한 뒤 다듬은 참고 결과물입니다.
    같은 기능(LED 제어판)을 여러분은 '다른 디자인'으로 만들어 보세요. (exercises/01 7단계)
  -->
  <main class="card">
    <h1 class="title">💡 LED 제어판</h1>
    <p class="subtitle">이름을 넣고 켜기/끄기를 눌러 보세요</p>

    <!-- 표시등: 켜짐=노랑(빛남), 꺼짐=회색 -->
    <div class="lamp-wrap">
      <div id="lamp" class="lamp is-on"></div>
      <div id="lampLabel" class="lamp-label">🟡 ON</div>
    </div>

    <input id="nameInput" class="name-input" type="text" placeholder="이름" maxlength="20" />

    <div class="buttons">
      <button id="onButton" class="btn btn-on">켜기</button>
      <button id="offButton" class="btn btn-off">끄기</button>
    </div>

    <h2 class="history-title">변경 이력</h2>
    <ul id="history" class="history"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
